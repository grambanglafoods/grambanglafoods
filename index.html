<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GramBangla Foods | Sapaghar, Naogaon</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card: #ffffff;
      --primary: #1b5e20;
      --primary-dark: #124116;
      --accent: #e65100;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #e4e7eb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(27, 94, 32, 0.15);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      touch-action: manipulation;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      touch-action: manipulation;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      min-height: 44px;
      font-weight: 600;
      transition: transform 0.08s ease, opacity 0.15s ease;
      position: relative;
      z-index: 2;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--primary);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .status-pill {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.16);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .nav-tab {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 1.05rem;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin: 8px 0 12px;
    }

    .form-row {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .order-item {
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>GramBangla Foods</h1>
      <p>Sapaghar, Naogaon</p>
    </div>
    <div id="dbStatus" class="status-pill">Connecting...</div>
  </header>

  <div class="container">
    <div id="navTabs" class="nav-tabs" role="tablist">
      <button type="button" class="nav-tab active" data-tab="shop">পণ্যসমূহ</button>
      <button type="button" class="nav-tab" data-tab="cart">কার্ট (<span id="cartCount">0</span>)</button>
      <button type="button" class="nav-tab" data-tab="orders">অর্ডারসমূহ</button>
      <button type="button" class="nav-tab" data-tab="admin">পণ্য যোগ</button>
    </div>

    <section id="tab-shop" class="panel active">
      <div id="productList" class="grid"></div>
    </section>

    <section id="tab-cart" class="panel">
      <div class="card">
        <h3>আপনার কার্ট</h3>
        <div id="cartItems"></div>
        <div id="cartTotal" class="price">মোট: ৳0</div>
        <div class="form-row">
          <input id="customerName" type="text" placeholder="গ্রাহকের নাম" />
          <input id="customerPhone" type="tel" placeholder="মোবাইল নম্বর" />
          <textarea id="customerAddress" rows="2" placeholder="ঠিকানা (Sapaghar / Naogaon বা ডেলিভারি ঠিকানা)"></textarea>
        </div>
        <button type="button" id="placeOrderBtn" class="btn-accent" style="width: 100%;">অর্ডার কনফার্ম করুন</button>
      </div>
    </section>

    <section id="tab-orders" class="panel">
      <div class="card">
        <h3>সর্বশেষ অর্ডারসমূহ</h3>
        <div id="orderList"></div>
      </div>
    </section>

    <section id="tab-admin" class="panel">
      <div class="card">
        <h3>নতুন পণ্য যুক্ত করুন</h3>
        <form id="addProductForm" class="form-row">
          <input id="prodName" type="text" placeholder="পণ্যের নাম (যেমন: দেশি আম / গুড়)" required />
          <input id="prodPrice" type="number" min="1" step="any" placeholder="দাম (৳)" required />
          <input id="prodUnit" type="text" placeholder="পরিমাণ/একক (যেমন: ১ কেজি / ৫০০ গ্রাম)" value="১ কেজি" />
          <button type="submit" class="btn-primary">পণ্য সেভ করুন</button>
        </form>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQhllTW2lHZh6oMHC22Jyzw5ZTUUKL1VA",
      authDomain: "grambanglafoods-42156.firebaseapp.com",
      projectId: "grambanglafoods-42156",
      storageBucket: "grambanglafoods-42156.firebasestorage.app",
      messagingSenderId: "2936943077",
      appId: "1:2936943077:web:896f73d34bbbe8e4faff0c",
      measurementId: "G-T3C7SHY1H2"
    };

    const STORAGE_KEYS = {
      products: "gbf_products_v1",
      orders: "gbf_orders_v1"
    };

    const defaultProducts = [
      { id: "p1", name: "খাঁটি গুড়", price: 320, unit: "১ কেজি" },
      { id: "p2", name: "সাপাহার আম", price: 180, unit: "১ কেজি" }
    ];

    let products = JSON.parse(localStorage.getItem(STORAGE_KEYS.products) || "null") || defaultProducts;
    let orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders) || "[]");
    let cart = [];
    let db = null;
    let firestoreReady = false;

    const statusEl = document.getElementById("dbStatus");

    function saveLocal() {
      localStorage.setItem(STORAGE_KEYS.products, JSON.stringify(products));
      localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(orders));
    }

    function renderProducts() {
      const el = document.getElementById("productList");
      if (!products.length) {
        el.innerHTML = `<div class="card empty">কোনো পণ্য পাওয়া যায়নি। "পণ্য যোগ" ট্যাব থেকে পণ্য যুক্ত করুন।</div>`;
        return;
      }
      el.innerHTML = products.map((p) => `
        <div class="card">
          <h3>${escapeHtml(p.name)}</h3>
          <div>একক: ${escapeHtml(p.unit || "১টি")}</div>
          <div class="price">৳${Number(p.price || 0)}</div>
          <button type="button" class="btn-primary add-to-cart-btn" data-id="${escapeAttr(p.id)}" style="width:100%;">
            কার্টে যোগ করুন
          </button>
        </div>
      `).join("");
    }

    function renderCart() {
      document.getElementById("cartCount").textContent = cart.reduce((sum, item) => sum + item.qty, 0);
      const listEl = document.getElementById("cartItems");
      const totalEl = document.getElementById("cartTotal");

      if (!cart.length) {
        listEl.innerHTML = `<div class="empty">কার্ট খালি আছে।</div>`;
        totalEl.textContent = "মোট: ৳0";
        return;
      }

      let total = 0;
      listEl.innerHTML = cart.map((item) => {
        const sub = Number(item.price) * item.qty;
        total += sub;
        return `
          <div class="order-item" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <strong>${escapeHtml(item.name)}</strong><br/>
              <small>৳${Number(item.price)} × ${item.qty} = ৳${sub}</small>
            </div>
            <button type="button" class="btn-outline remove-cart-btn" data-id="${escapeAttr(item.id)}">বাদ দিন</button>
          </div>
        `;
      }).join("");
      totalEl.textContent = `মোট: ৳${total}`;
    }

    function renderOrders() {
      const el = document.getElementById("orderList");
      if (!orders.length) {
        el.innerHTML = `<div class="empty">এখনো কোনো অর্ডার আসেনি।</div>`;
        return;
      }
      el.innerHTML = orders.map((o) => `
        <div class="order-item">
          <div><strong>${escapeHtml(o.customerName || "গ্রাহক")}</strong> — <span>৳${Number(o.total || 0)}</span></div>
          <small>ফোন: ${escapeHtml(o.customerPhone || "-")} | ঠিকানা: ${escapeHtml(o.customerAddress || "-")}</small>
        </div>
      `).join("");
    }

    function switchTab(tabName) {
      document.querySelectorAll(".nav-tab").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tab === tabName);
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `tab-${tabName}`);
      });
    }

    document.addEventListener("click", (event) => {
      const tabBtn = event.target.closest(".nav-tab");
      if (tabBtn) {
        switchTab(tabBtn.dataset.tab);
        return;
      }

      const addBtn = event.target.closest(".add-to-cart-btn");
      if (addBtn) {
        const prod = products.find((p) => String(p.id) === String(addBtn.dataset.id));
        if (!prod) return;
        const existing = cart.find((c) => String(c.id) === String(prod.id));
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ id: prod.id, name: prod.name, price: Number(prod.price), qty: 1 });
        }
        renderCart();
        addBtn.textContent = "যোগ হয়েছে ✓";
        setTimeout(() => {
          addBtn.textContent = "কার্টে যোগ করুন";
        }, 700);
        return;
      }

      const removeBtn = event.target.closest(".remove-cart-btn");
      if (removeBtn) {
        cart = cart.filter((c) => String(c.id) !== String(removeBtn.dataset.id));
        renderCart();
      }
    });

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("prodName").value.trim();
      const price = Number(document.getElementById("prodPrice").value);
      const unit = document.getElementById("prodUnit").value.trim() || "১ কেজি";
      if (!name || !price) return;

      const newProduct = {
        id: String(Date.now()),
        name,
        price,
        unit,
        createdAt: Date.now()
      };

      if (firestoreReady && db) {
        try {
          await addDoc(collection(db, "products"), newProduct);
        } catch (err) {
          products.unshift(newProduct);
          saveLocal();
          renderProducts();
        }
      } else {
        products.unshift(newProduct);
        saveLocal();
        renderProducts();
      }

      e.target.reset();
      document.getElementById("prodUnit").value = "১ কেজি";
      switchTab("shop");
    });

    document.getElementById("placeOrderBtn").addEventListener("click", async () => {
      if (!cart.length) {
        alert("আগে কার্টে অন্তত একটি পণ্য যোগ করুন।");
        return;
      }
      const customerName = document.getElementById("customerName").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      const customerAddress = document.getElementById("customerAddress").value.trim();

      if (!customerName || !customerPhone) {
        alert("অনুগ্রহ করে গ্রাহকের নাম ও মোবাইল নম্বর দিন।");
        return;
      }

      const total = cart.reduce((sum, item) => sum + Number(item.price) * item.qty, 0);
      const newOrder = {
        id: String(Date.now()),
        customerName,
        customerPhone,
        customerAddress,
        items: cart,
        total,
        createdAt: Date.now()
      };

      if (firestoreReady && db) {
        try {
          await addDoc(collection(db, "orders"), newOrder);
        } catch (err) {
          orders.unshift(newOrder);
          saveLocal();
          renderOrders();
        }
      } else {
        orders.unshift(newOrder);
        saveLocal();
        renderOrders();
      }

      cart = [];
      renderCart();
      document.getElementById("customerName").value = "";
      document.getElementById("customerPhone").value = "";
      document.getElementById("customerAddress").value = "";
      alert("আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।");
      switchTab("orders");
    });

    function initFirebaseSync() {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        firestoreReady = true;
        statusEl.textContent = "Firestore Live";

        const prodQuery = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(prodQuery, (snap) => {
          const cloudProducts = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          if (cloudProducts.length) {
            products = cloudProducts;
            saveLocal();
            renderProducts();
          }
        });

        const orderQuery = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        onSnapshot(orderQuery, (snap) => {
          orders = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          saveLocal();
          renderOrders();
        });
      } catch (err) {
        statusEl.textContent = "Local Fallback";
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }

    renderProducts();
    renderCart();
    renderOrders();
    initFirebaseSync();
  </script>
</body>
</html>
